<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>RentEquip</title>
    <!-- Applies the saved theme before the first paint, so dark mode never flashes white. -->
    <script>
      try {
        var theme = localStorage.getItem('rentequip.theme')
        if (theme === 'dark' || (theme === null && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {}
      try {
        var language = localStorage.getItem('rentequip.language')
        if (language === 'en') document.documentElement.lang = 'en-US'
        if (language === 'zh') document.documentElement.lang = 'zh-CN'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
